name: Temporary analyzer fix pass

on:
  push:
    branches:
      - work/form-controls
      - work/design-system-controls

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Apply supported analyzer fixes
        run: dart fix --apply
      - name: Format Dart sources
        run: dart format .
      - name: Commit analyzer fixes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.dart'
            git commit -m "chore: apply analyzer fixes"
            git push
          fi
