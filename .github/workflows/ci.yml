name: Temporary form-controls test check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Test
        run: flutter test
