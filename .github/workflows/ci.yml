name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Show formatter output for baseline files
        run: >-
          dart format --output=show
          lib/app/router.dart
          lib/design_system/components/kit_button.dart
          lib/design_system/components/kit_checkbox.dart
          lib/design_system/components/kit_icon_button.dart
          lib/design_system/components/kit_switch.dart
          lib/design_system/theme/kit_theme.dart
          lib/features/showcase/presentation/showcase_screen.dart
          test/design_system/kit_button_test.dart
          test/design_system/kit_icon_button_test.dart
          test/design_system/kit_text_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
