name: flutter_mobile_starter_kit
description: A production-oriented Flutter foundation for Android and iOS with a first-party UI system.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.13.7 <4.0.0"
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false
  generate: true
